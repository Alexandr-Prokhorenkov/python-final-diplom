{% extends "admin/base_site.html" %}
{% block content %}
<h1>Импорт прайса: {{ shop }}</h1>
<p>Владелец: {{ shop.user|default:"не указан" }}</p>
<form method="post" enctype="multipart/form-data" novalidate>
    {% csrf_token %}
    {{ form.as_p }}
    <div class="submit-row">
        <input type="submit" value="Запустить импорт" class="default">
        <a href="{% url 'admin:backend_shop_change' shop.pk %}" class="button cancel-link">Отмена</a>
    </div>
</form>
{% endblock %}
